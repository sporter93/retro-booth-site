# Fly.io config for the Retro Booth website.
# App lives in The Instabooth org on Fly.io.
# One small machine in Sydney. `fly deploy` on an app with no machines
# creates two by default; use `fly deploy --ha=false` to keep it to one.
app = "retro-booth-site-mmim3a"
primary_region = "syd"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Single machine: keep it running so no visitor waits for a cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
